[tools]
zig = "0.16.0"

[tasks.nightly-release-gh]
description = "Publish the dated Windows build ZIP as a nightly GitHub release"
run = """
set -e
TAG=nightly-$(date +%Y%m%d)
ZIP="ghostty-$TAG.zip"
if gh release view "$TAG" --repo kazto/ghostty >/dev/null 2>&1; then
  gh release delete "$TAG" --repo kazto/ghostty --cleanup-tag --yes
fi
gh release create "$TAG" --repo kazto/ghostty --title "Nightly Build $(date +%Y-%m-%d)" --notes "Nightly Windows build from commit $(git rev-parse --short HEAD)." "$ZIP"
"""

[tasks.nightly-release-berg]
description = "Publish the dated Windows build ZIP as a nightly Codeberg release"
run = """
set -e
TAG=nightly-$(date +%Y%m%d)
ZIP="ghostty-$TAG.zip"
git push berg HEAD
tea release delete --login codeberg.org --repo kazto/ghostty --confirm --delete-tag "$TAG" 2>/dev/null || true
tea release create --login codeberg.org --repo kazto/ghostty --tag "$TAG" --target "$(git rev-parse HEAD)" --title "Nightly Build $(date +%Y-%m-%d)" --note "Nightly Windows build from commit $(git rev-parse --short HEAD)." --asset "$ZIP"
"""

[tasks.build-win]
description = "Build for Windows and create a dated nightly ZIP"
run = """
newgrp docker -c "sh ./build-win.sh"
"""
